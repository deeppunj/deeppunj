name: update-readme

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  push:                     # also right after I change the readme or the script
    branches: [main]
    paths:
      - "README.md"
      - ".github/scripts/update_recent.py"
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/update_recent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # commits made with GITHUB_TOKEN don't trigger the push event again, so no loop
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git commit -am "Update recent projects" && git push)
